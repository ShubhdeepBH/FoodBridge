  </head><body class="bg-background font-body-md text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-mobile flex items-center gap-md"><button class="w-11 h-11 flex items-center justify-center text-on-surface-variant" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex items-center gap-xs"><img alt="FoodBridge Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGFtNIlnifd3ROl4aQCxf11PeKIhg9fOrPNhn2KiKFuRLCXTz8MSxFyVCwoGel-t3cOnsFiGNn6549hJ2Ms9zdGl9_K1KkFrNjI_qUWCUiN3ty0ksedeFQARi-5iuN5QqmSmSBn_eT4BAaQOFSLVV2KpC05cgyE1zeTzj3aMMO1kOyCYMMlpFvriVi1392S2MDHmUTcgSsYWQq_g4T_m_0IKsfp9BMSB75xO1CZB5N7jCPIXffjdK7"/><span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Donate Food Form</span></div></div></header><main class="pt-16 min-h-screen bg-background"><div class="flex flex-col w-full pb-safe px-margin-mobile gap-lg">
<div class="mt-lg">
<h2 class="font-headline-lg-mobile text-on-surface">Donate Surplus</h2>
<p class="font-body-md text-on-surface-variant mt-sm">Post a donation to help bridge the gap.</p>
</div>
<form class="flex flex-col gap-xl" id="donate-form">
<!-- Section 1: The Basics -->
<section class="flex flex-col gap-md">
<h3 class="font-headline-md text-on-surface">The Basics</h3>
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-on-surface-variant ml-xs" for="food-title">Food Title</label>
<input class="bg-surface-container-lowest text-on-surface w-full py-3 px-4 rounded-lg outline outline-1 outline-outline-variant focus:outline-primary transition-all duration-200 placeholder-on-surface-variant/50 font-body-lg shadow-[0_4px_12px_rgba(31,41,55,0.04)]" id="food-title" placeholder="e.g., 10kg Mixed Pastries" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<span class="font-label-md text-on-surface-variant ml-xs">Category</span>
<div class="flex flex-wrap gap-2" id="category-chips">
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="bakery"/>
<div class="px-4 py-2 rounded-full outline outline-1 outline-outline-variant text-on-surface-variant font-label-md peer-checked:bg-primary-container/10 peer-checked:text-primary peer-checked:outline-primary peer-checked:outline-2 transition-all">
              Bakery
            </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="produce"/>
<div class="px-4 py-2 rounded-full outline outline-1 outline-outline-variant text-on-surface-variant font-label-md peer-checked:bg-primary-container/10 peer-checked:text-primary peer-checked:outline-primary peer-checked:outline-2 transition-all">
              Produce
            </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="prepared"/>
<div class="px-4 py-2 rounded-full outline outline-1 outline-outline-variant text-on-surface-variant font-label-md peer-checked:bg-primary-container/10 peer-checked:text-primary peer-checked:outline-primary peer-checked:outline-2 transition-all">
              Prepared Meals
            </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="dairy"/>
<div class="px-4 py-2 rounded-full outline outline-1 outline-outline-variant text-on-surface-variant font-label-md peer-checked:bg-primary-container/10 peer-checked:text-primary peer-checked:outline-primary peer-checked:outline-2 transition-all">
              Dairy &amp; Eggs
            </div>
</label>
</div>
</div>
</section>
<!-- Section 2: Details & Photo -->
<section class="flex flex-col gap-md">
<h3 class="font-headline-md text-on-surface">Details</h3>
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-on-surface-variant ml-xs" for="expiry-date">Expiry Date &amp; Time</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">event</span>
<input class="bg-surface-container-lowest text-on-surface w-full py-3 pl-12 pr-4 rounded-lg outline outline-1 outline-outline-variant focus:outline-primary transition-all duration-200 font-body-lg shadow-[0_4px_12px_rgba(31,41,55,0.04)] appearance-none" id="expiry-date" type="datetime-local"/>
</div>
</div>
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-on-surface-variant ml-xs" for="pickup-instructions">Pickup Instructions</label>
<textarea class="bg-surface-container-lowest text-on-surface w-full py-3 px-4 rounded-lg outline outline-1 outline-outline-variant focus:outline-primary transition-all duration-200 placeholder-on-surface-variant/50 font-body-lg shadow-[0_4px_12px_rgba(31,41,55,0.04)] resize-none" id="pickup-instructions" placeholder="e.g., Use side door, ask for Maria." rows="3"></textarea>
</div>
</section>
<section class="flex flex-col gap-md">
<h3 class="font-headline-md text-on-surface">Photo</h3>
<p class="font-body-md text-on-surface-variant">A clear photo helps rescuers know what to expect.</p>
<div class="w-full relative h-48 rounded-xl outline outline-2 outline-dashed outline-outline-variant bg-surface-container-lowest flex flex-col items-center justify-center gap-sm overflow-hidden group cursor-pointer" onclick="document.getElementById('photo-upload').click()">
<input accept="image/*" class="sr-only" id="photo-upload" type="file"/>
<div class="flex flex-col items-center gap-sm transition-opacity duration-300" id="upload-placeholder">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<span class="font-label-md text-on-surface-variant text-center px-4">Tap to upload a photo<br/><span class="font-label-sm font-normal opacity-70">JPG, PNG up to 5MB</span></span>
</div>
<!-- Preview image hidden by default -->
<img alt="Upload preview" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300 pointer-events-none hidden" id="photo-preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1AF-gbFcqc06UKagbSYe4DRHA5cZ6p8eqvnmPtLgsMZzVUwidbz8MRQwskTj0PHijyHexZ77KvxoI0xRiD2SHqRU4J_JzWJ7FXrF9MzCASyZ96w5y2G5TN8HQLN1PZ3NgWInPb_IKgy7ONAp93tuV-2hARrVCPBiQ5yObzyARal55Km3DDj7YL5b9RPAoq12JQyFdpkOTwJbQgrF8k-grZLLja54CHYZSfq3LkmeRotVIjzYeL3Mm"/>
<div class="absolute inset-0 bg-surface/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center hidden" id="photo-preview-overlay">
<span class="font-label-md text-on-surface bg-surface-container px-4 py-2 rounded-full shadow-md">Change Photo</span>
</div>
</div>
</section>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 shadow-[0_-4px_24px_rgba(0,0,0,0.04)] z-40 pb-safe">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label-md text-[16px] shadow-md hover:bg-primary/90 transition-colors active:scale-[0.98] flex items-center justify-center gap-2" id="submit-btn" type="button">
<span>Post Donation</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Spacer for fixed footer -->
<div class="h-24"></div>
</form>
</div>
<script>
    // Handle photo upload preview
    const photoInput = document.getElementById('photo-upload');
    const photoPreview = document.getElementById('photo-preview');
    const uploadPlaceholder = document.getElementById('upload-placeholder');
    const previewOverlay = document.getElementById('photo-preview-overlay');

    photoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                photoPreview.src = e.target.result;
                photoPreview.classList.remove('hidden');
                photoPreview.classList.remove('opacity-0');
                uploadPlaceholder.classList.add('opacity-0');
                previewOverlay.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }
    });

    // Form submit animation simulation
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.addEventListener('click', function() {
        const originalContent = this.innerHTML;
        this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span>Posting...</span>';
        this.classList.add('opacity-80');
        
        setTimeout(() => {
            this.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>Donation Posted!</span>';
            this.classList.remove('bg-primary');
            this.classList.add('bg-[#059669]'); // Slight green shift for success
            
            setTimeout(() => {
                // Reset form (simulated navigation)
                document.getElementById('donate-form').reset();
                this.innerHTML = originalContent;
                this.classList.add('bg-primary');
                this.classList.remove('bg-[#059669]', 'opacity-80');
                
                // Reset image preview
                photoPreview.src = 'placeholder';
                photoPreview.classList.add('hidden', 'opacity-0');
                uploadPlaceholder.classList.remove('opacity-0');
                previewOverlay.classList.add('hidden');
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 2000);
        }, 1500);
    });
</script></main></body></html>
