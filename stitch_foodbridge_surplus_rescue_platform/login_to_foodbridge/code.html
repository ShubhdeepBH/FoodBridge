<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary-container": "#f7fff2", "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#adc6ff", "surface-container-low": "#eff4ff", "secondary-fixed": "#d8e2ff", "on-secondary": "#ffffff", "on-secondary-fixed-variant": "#004395", "surface-bright": "#f8f9ff", "secondary": "#0058be", "outline-variant": "#bdcaba", "primary-container": "#00873a", "on-surface-variant": "#3e4a3d", "surface-container-highest": "#d9e3f6", "background": "#f8f9ff", "on-tertiary-container": "#fffbff", "tertiary-fixed": "#ffddb8", "surface-dim": "#d0dbed", "surface-container-high": "#dee9fc", "inverse-on-surface": "#eaf1ff", "surface-tint": "#006e2d", "on-tertiary-fixed-variant": "#653e00", "on-error-container": "#93000a", "surface-variant": "#d9e3f6", "on-primary": "#ffffff", "on-secondary-container": "#fefcff", "on-primary-fixed": "#002109", "tertiary": "#825100", "outline": "#6e7b6c", "on-tertiary": "#ffffff", "on-tertiary-fixed": "#2a1700", "primary": "#006b2c", "inverse-primary": "#62df7d", "surface-container": "#e6eeff", "tertiary-fixed-dim": "#ffb95f", "on-background": "#121c2a", "error": "#ba1a1a", "primary-fixed": "#7ffc97", "surface": "#f8f9ff", "tertiary-container": "#a36700", "secondary-container": "#2170e4", "on-surface": "#121c2a", "on-secondary-fixed": "#001a42", "inverse-surface": "#27313f", "on-primary-fixed-variant": "#005320", "primary-fixed-dim": "#62df7d", "on-error": "#ffffff", "error-container": "#ffdad6" } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);

  </head><body class="bg-background font-body-md text-on-surface"><main class="min-h-screen"><div class="flex flex-col w-full h-full items-center justify-center p-4 relative overflow-hidden bg-background">
<!-- Ambient Background Elements -->
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[100px] pointer-events-none"></div>
<div class="absolute top-[60%] -right-[10%] w-[40%] h-[40%] rounded-full bg-secondary-container/15 blur-[80px] pointer-events-none"></div>
<div class="w-full max-w-[420px] z-10">
<!-- Logo Area -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-surface-container-highest rounded-2xl shadow-sm flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<h1 class="font-headline-lg text-on-surface text-center">FoodBridge</h1>
<p class="font-body-md text-on-surface-variant text-center mt-2">Connecting surplus to those who need it most.</p>
</div>
<!-- Glassmorphism Card -->
<div class="bg-surface-container-lowest/80 backdrop-blur-md rounded-[24px] p-6 lg:p-8 shadow-sm">
<!-- Tab Toggle -->
<div class="flex bg-surface-container p-1 rounded-full mb-8 relative">
<!-- Active Indicator -->
<div class="absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-full shadow-sm transition-transform duration-300 ease-out z-0" id="tabIndicator"></div>
<button class="flex-1 py-2 font-label-md text-on-surface relative z-10 transition-colors" id="donorTab" onclick="switchTab('donor')">
                    I am a Donor
                </button>
<button class="flex-1 py-2 font-label-md text-on-surface-variant relative z-10 transition-colors" id="ngoTab" onclick="switchTab('ngo')">
                    I am an NGO
                </button>
</div>
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-on-surface-variant ml-1">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/50 text-[20px]">mail</span>
<input class="w-full h-12 bg-surface-container-lowest text-on-surface font-body-md pl-10 pr-4 rounded-xl outline-none shadow-[inset_0_0_0_1px_#E5E7EB] focus:shadow-[inset_0_0_0_2px_#006b2c] transition-shadow placeholder:text-on-surface-variant/40" placeholder="name@organization.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center ml-1">
<label class="font-label-sm text-on-surface-variant">Password</label>
<a class="font-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/50 text-[20px]">lock</span>
<input class="w-full h-12 bg-surface-container-lowest text-on-surface font-body-md pl-10 pr-4 rounded-xl outline-none shadow-[inset_0_0_0_1px_#E5E7EB] focus:shadow-[inset_0_0_0_2px_#006b2c] transition-shadow placeholder:text-on-surface-variant/40" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="mt-2 w-full h-12 bg-primary text-on-primary font-label-md rounded-xl hover:bg-primary/90 transition-colors shadow-sm flex items-center justify-center gap-2" type="button">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="my-6 relative flex items-center justify-center">
<div class="absolute w-full h-[1px] bg-outline-variant/30"></div>
<span class="bg-surface-container-lowest/80 px-4 font-label-sm text-on-surface-variant relative z-10">or continue with</span>
</div>
<div class="flex flex-col gap-3">
<button class="w-full h-11 bg-surface-container-lowest text-on-surface font-label-md rounded-xl shadow-[inset_0_0_0_1px_#E5E7EB] hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3">
<svg class="w-5 h-5" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path><path d="M1 1h22v22H1z" fill="none"></path></svg>
                    Google
                </button>
<button class="w-full h-11 bg-surface-container-lowest text-on-surface font-label-md rounded-xl shadow-[inset_0_0_0_1px_#E5E7EB] hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.61 1.54-1.43 2.98-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path></svg>
                    Apple
                </button>
</div>
</div>
<div class="mt-8 text-center">
<p class="font-body-md text-on-surface-variant">
                New to FoodBridge? 
                <a class="font-label-md text-primary hover:underline ml-1" href="#">Create an Account</a>
</p>
</div>
</div>
</div>
<script>
    function switchTab(tab) {
        const indicator = document.getElementById('tabIndicator');
        const donorTab = document.getElementById('donorTab');
        const ngoTab = document.getElementById('ngoTab');
        
        if (tab === 'ngo') {
            indicator.style.transform = 'translateX(100%)';
            ngoTab.classList.replace('text-on-surface-variant', 'text-on-surface');
            donorTab.classList.replace('text-on-surface', 'text-on-surface-variant');
        } else {
            indicator.style.transform = 'translateX(0)';
            donorTab.classList.replace('text-on-surface-variant', 'text-on-surface');
            ngoTab.classList.replace('text-on-surface', 'text-on-surface-variant');
        }
    }
</script></main></body></html>
