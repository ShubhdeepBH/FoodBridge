<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="FoodBridge Donation Details - Review pickup times, quantity, and donor instructions."
    />
    <title>FoodBridge | Donation Details</title>
    <!-- Inline security redirection guard to prevent unauthenticated flashing -->
    <script>
      (function () {
        const userJson = sessionStorage.getItem("currentUser");
        if (!userJson) {
          window.location.replace("login.html");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/auth.js"></script>
    <script defer src="js/donations.js"></script>
  </head>
  <body>
    <div class="stitch-page" id="detailsPageContainer">
      <!-- Fixed Header Bar -->
      <header class="stitch-header" id="detailsHeader">
        <div class="stitch-header__inner">
          <div class="stitch-header__brand">
            <!-- Back Button Navigation -->
            <button class="details-hero__back-btn" onclick="goBackToFeed()" type="button" aria-label="Go Back" style="background: var(--color-surface-high); color: var(--color-text); margin-right: var(--space-2);">
              <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
            </button>
            <span class="stitch-header__title" style="font-size: 20px;">Donation Details</span>
          </div>
          <!-- Profile Badge -->
          <div class="stitch-profile" aria-hidden="true">
            <span class="material-symbols-outlined">person</span>
          </div>
        </div>
      </header>

      <!-- Main details template container -->
      <main class="stitch-main" style="padding-top: 64px;">
        <!-- Container for dynamic render -->
        <div id="dynamicDetailsWrapper">
          <!-- Loading state placeholder -->
          <div class="db-container">
            <div class="loading-state">
              <span class="loading-state__dot"></span>
              <span class="loading-state__dot"></span>
              <span class="loading-state__dot"></span>
            </div>
          </div>
        </div>
        
        <div class="bottom-spacer" aria-hidden="true"></div>
      </main>
    </div>

    <!-- Script details lookup controller -->
    <script>
      /**
       * Directs back to browse available page or history back.
       */
      function goBackToFeed() {
        if (document.referrer && document.referrer.includes("available-donations.html")) {
          window.location.href = "available-donations.html";
        } else {
          // If navigated directly, attempt to go back to relevant dashboard based on role
          if (typeof getCurrentUser === "function") {
            const user = getCurrentUser();
            if (user && user.role) {
              window.location.href = user.role === "donor" ? "donor-dashboard.html" : "available-donations.html";
              return;
            }
          }
          window.location.href = "index.html";
        }
      }

      /**
       * Safely escapes HTML entities to prevent XSS injection.
       * @param {*} value
       * @returns {string}
       */
      function escapeHtml(value) {
        if (value === null || value === undefined) return "";
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      document.addEventListener("DOMContentLoaded", () => {
        const detailsWrapper = document.getElementById("dynamicDetailsWrapper");

        // 1. Get donation ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const donationId = urlParams.get("id");

        /**
         * Renders the details visual elements.
         */
        function renderDonation(item) {
          const categoryLabels = {
            bakery: "Bakery",
            produce: "Produce",
            prepared: "Prepared Meal",
            dairy: "Dairy & Eggs"
          };

          const categoryIcons = {
            bakery: "bakery_dining",
            produce: "agriculture",
            prepared: "local_dining",
            dairy: "egg"
          };

          // Format relative time left
          const expiryDate = item.expiry ? new Date(item.expiry) : null;
          const timeDiff = expiryDate ? (expiryDate - new Date()) : -1;
          let expiryLabel = "Expiring soon";

          if (timeDiff > 0) {
            const hoursLeft = Math.floor(timeDiff / (1000 * 60 * 60));
            if (hoursLeft > 24) {
              expiryLabel = `Expires in ${Math.floor(hoursLeft / 24)} days`;
            } else if (hoursLeft > 0) {
              expiryLabel = `Expires in ${hoursLeft}h`;
            } else {
              const minsLeft = Math.floor(timeDiff / (1000 * 60));
              expiryLabel = `Expires in ${minsLeft} mins`;
            }
          } else {
            expiryLabel = "Expired";
          }

          detailsWrapper.innerHTML = `
            <!-- Large Image Header Section -->
            <section class="details-hero">
              <div class="details-hero__scrim"></div>
              
              <!-- Floating Category and Expiry badges -->
              <div class="details-hero__badges">
                <div class="details-hero__badge details-hero__badge--timer">
                  <span class="material-symbols-outlined" aria-hidden="true">timer</span>
                  <span>${escapeHtml(expiryLabel)}</span>
                </div>
                <div class="details-hero__badge details-hero__badge--category">
                  <span class="material-symbols-outlined" aria-hidden="true">eco</span>
                  <span>${Object.prototype.hasOwnProperty.call(categoryLabels, item.category) ? categoryLabels[item.category] : escapeHtml(item.category || 'Other')}</span>
                </div>
              </div>
            </section>

            <!-- Metadata Info Grid Card overlay -->
            <div class="db-container" style="padding-top: 0;">
              <section class="details-info-grid">
                <!-- Title and Quantity -->
                <div>
                  <h1 class="db-welcome-card__title" style="font-size: 26px; line-height: 1.25; margin-bottom: 8px;">${escapeHtml(item.title || '')}</h1>
                  <p style="margin: 0; font-size: 16px; font-weight: 600; color: var(--color-primary-deep); display: flex; align-items: center; gap: 6px;">
                    <span class="material-symbols-outlined" style="font-size: 20px;">scale</span>
                    <span>${escapeHtml(item.quantity || '')} Total Quantity</span>
                  </p>
                </div>

                <!-- Donor Card -->
                <div class="db-entity-card" style="background: var(--color-surface-low); border: 1px solid var(--color-border); padding: 12px 16px; justify-content: space-between; align-items: center;">
                  <div class="flex items-center gap-sm">
                    <div class="db-entity-card__avatar" style="background: var(--color-surface); width: 44px; height: 44px;">
                      <span class="material-symbols-outlined">${Object.prototype.hasOwnProperty.call(categoryIcons, item.category) ? categoryIcons[item.category] : 'storefront'}</span>
                    </div>
                    <div>
                      <h4 class="db-entity-card__name" style="font-size: 15px;">${escapeHtml(item.donorName || 'Anonymous Donor')}</h4>
                      <p class="db-entity-card__email" style="font-size: 11px; font-weight: 700; color: var(--color-primary-deep); display: flex; align-items: center; gap: 2px;">
                        <span class="material-symbols-outlined" style="font-size: 14px; font-variation-settings: 'FILL' 1;">star</span>
                        <span>4.8 Rating • Verified Donor</span>
                      </p>
                    </div>
                  </div>
                  <button class="db-welcome-card__btn" type="button" onclick="alert('Donor contact details will be enabled upon claim confirmation.');" style="padding: 6px 14px; font-size: 12px; box-shadow: none; border-radius: 8px;">
                    <span>Contact</span>
                  </button>
                </div>

                <!-- Description -->
                <div class="details-info-section">
                  <h3 class="details-info-section__title">Description</h3>
                  <p class="details-info-section__body">${escapeHtml(item.description || '')}</p>
                </div>

                <!-- Location & Mock Map -->
                <div class="details-info-section">
                  <h3 class="details-info-section__title">Pickup Location</h3>
                  <p class="details-info-section__body" style="font-weight: 600; color: var(--color-text); display: flex; align-items: center; gap: 4px;">
                    <span class="material-symbols-outlined" style="font-size: 18px; color: var(--color-primary);">location_on</span>
                    <span>${escapeHtml(item.pickupLocation || '')}</span>
                  </p>
                  
                  <!-- Static Map Placeholder -->
                  <div class="details-map" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg');" aria-label="Mock Map Location"></div>
                </div>

                <!-- Instructions -->
                <div class="details-info-section" style="background: var(--color-surface-container-low); border-radius: 12px; padding: 16px;">
                  <h3 class="details-info-section__title" style="display: flex; align-items: center; gap: 6px; font-size: 13px;">
                    <span class="material-symbols-outlined" style="font-size: 18px; color: var(--color-text-muted);">info</span>
                    <span>Pickup Instructions</span>
                  </h3>
                  <p class="details-info-section__body" style="margin-top: 6px; font-size: 14px;">${escapeHtml(item.pickupInstructions || 'No specific instructions provided.')}</p>
                </div>
              </section>
            </div>

            <!-- Fixed Bottom Action Bar -->
            <div class="fixed-bottom-bar">
              <div class="fixed-bottom-bar__inner">
                <button class="login-submit-btn" id="confirmRequestBtn" type="button" onclick="handleConfirmRequest()" style="margin: 0;">
                  <span class="material-symbols-outlined" aria-hidden="true">check_circle</span>
                  <span>Confirm Request</span>
                </button>
              </div>
            </div>
          `;

          // Validate and safely apply hero image URL via DOM API (only http/https allowed)
          if (item.imageUrl && typeof item.imageUrl === "string") {
            try {
              const parsedUrl = new URL(item.imageUrl.trim());
              if (parsedUrl.protocol === "http:" || parsedUrl.protocol === "https:") {
                const heroEl = detailsWrapper.querySelector(".details-hero");
                if (heroEl) {
                  heroEl.style.backgroundImage = `url("${parsedUrl.href}")`;
                }
              }
            } catch (urlErr) {
              // Unset or invalid URL scheme; leave background unset
            }
          }
        }

        /**
         * Renders error cards if listings are missing.
         */
        function renderError(message) {
          detailsWrapper.innerHTML = `
            <div class="db-container">
              <div class="details-error-card">
                <span class="material-symbols-outlined details-error-card__icon" aria-hidden="true">error</span>
                <h2 class="db-section-title">Listing Load Error</h2>
                <p style="color: var(--color-text-muted); font-size: 15px;">${escapeHtml(message)}</p>
                <button class="btn btn--primary" onclick="goBackToFeed()" type="button" style="margin-top: var(--space-4);">
                  <span class="material-symbols-outlined">arrow_back</span>
                  <span>Back to Browse Feed</span>
                </button>
              </div>
            </div>
          `;
        }

        /**
         * Asynchronously loads and renders donation details.
         * For legacy IDs, uses the cached record directly.
         * For MongoDB ObjectIds, fetches fresh backend data when available,
         * with graceful fallback to cached data if offline or network fails.
         */
        async function loadDonationDetails(id) {
          if (!id || typeof id !== "string") {
            renderError("No donation listing ID specified in URL query.");
            return;
          }

          const cleanId = id.trim();
          if (!cleanId) {
            renderError("No donation listing ID specified in URL query.");
            return;
          }

          const isMongoId = /^[0-9a-fA-F]{24}$/.test(cleanId);

          // 1. For legacy demo IDs (e.g. don-001), load directly from cache without querying backend
          if (!isMongoId) {
            const cachedItem = (typeof fetchDonationById === "function")
              ? await fetchDonationById(cleanId)
              : ((typeof getDonations === "function") ? getDonations().find(d => (d.id && String(d.id) === cleanId) || (d._id && String(d._id) === cleanId)) : null);

            if (cachedItem) {
              renderDonation(cachedItem);
            } else {
              renderError("Listing not found. The listing may have expired, been claimed, or deleted.");
            }
            return;
          }

          // 2. For MongoDB ObjectIds, prefer fresh backend result when available
          let freshItem = null;
          let isNotFound = false;

          try {
            const baseUrl = (typeof API_BASE_URL !== "undefined")
              ? API_BASE_URL
              : (typeof window !== "undefined" && window.API_BASE_URL)
                ? window.API_BASE_URL
                : "http://localhost:5000/api";

            const response = await fetch(`${baseUrl}/donations/${encodeURIComponent(cleanId)}`, {
              method: "GET",
              headers: { "Accept": "application/json" }
            });

            if (response.ok) {
              const data = await response.json();
              if (data && typeof data === "object" && !Array.isArray(data)) {
                freshItem = (typeof normalizeDonation === "function") ? normalizeDonation(data) : data;

                // Synchronize fresh record into local cache
                if (freshItem && typeof saveDonations === "function" && typeof getDonations === "function") {
                  const currentList = getDonations();
                  const existingIdx = currentList.findIndex(d => (d.id && String(d.id) === freshItem.id) || (d._id && String(d._id) === freshItem._id));
                  if (existingIdx >= 0) {
                    currentList[existingIdx] = freshItem;
                  } else {
                    currentList.push(freshItem);
                  }
                  saveDonations(currentList);
                }
              }
            } else if (response.status === 404) {
              isNotFound = true;
            }
          } catch (netErr) {
            console.error("Network error fetching live donation details. Falling back to cache:", netErr.message || netErr);
          }

          if (freshItem) {
            renderDonation(freshItem);
            return;
          }

          if (isNotFound) {
            renderError("Listing not found. The listing may have expired, been claimed, or deleted.");
            return;
          }

          // 3. Fallback to cached record if network failed or server was unreachable
          const cachedFallback = (typeof fetchDonationById === "function")
            ? await fetchDonationById(cleanId)
            : ((typeof getDonations === "function") ? getDonations().find(d => (d.id && String(d.id) === cleanId) || (d._id && String(d._id) === cleanId)) : null);

          if (cachedFallback) {
            renderDonation(cachedFallback);
          } else {
            renderError("Listing not found or service is currently unavailable. Please check your connection and try refreshing.");
          }
        }

        // Initialize details retrieval
        loadDonationDetails(donationId);
      });

      /**
       * Click callback handler for request button
       */
      function handleConfirmRequest() {
        alert("Donation claiming and NGO Requests histories will be implemented in the next module.");
      }
    </script>
  </body>
</html>
